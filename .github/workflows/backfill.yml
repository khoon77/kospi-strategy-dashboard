name: Backfill KOSPI history
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date YYYY-MM-DD"
        default: "2016-01-04"
        required: true
      end_date:
        description: "Optional end date YYYY-MM-DD"
        required: false
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Backfill official KRX history
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          KRX_INDEX_ENDPOINT: ${{ vars.KRX_INDEX_ENDPOINT }}
          BACKFILL_START: ${{ inputs.start_date }}
          BACKFILL_END: ${{ inputs.end_date }}
        run: python scripts/backfill_krx.py
      - run: python -m unittest discover -s tests -v
      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json data/market.js
          git commit -m "data: backfill KOSPI history from 2016"
          git push
