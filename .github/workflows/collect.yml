name: Collect market close
on:
  schedule:
    - cron: "20 8 * * 1-5"
  workflow_dispatch:
    inputs:
      market_date:
        description: "Optional date YYYY-MM-DD"
        required: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Collect and test
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          KRX_INDEX_ENDPOINT: ${{ vars.KRX_INDEX_ENDPOINT }}
          MARKET_DATE: ${{ inputs.market_date }}
        run: |
          python scripts/collect_market.py
          python -m unittest discover -s tests -v
      - name: Commit data
        run: |
          if git diff --quiet -- data/market.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          git commit -m "data: update KOSPI market close"
          git push

